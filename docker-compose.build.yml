# Builds LightMail from the sources instead of pulling the published image:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The version shown in the interface is the one of frontend/package.json,
# unless LIGHTMAIL_VERSION is set.
services:
  lightmail:
    image: lightmail:local
    pull_policy: build
    build:
      context: .
      args:
        VERSION: ${LIGHTMAIL_VERSION:-}
